<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StartProject Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Poppins,Arial,sans-serif;background:#f5f5fa;color:#17171d}button,input,select{font:inherit}.wrap{max-width:1450px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:42px;height:42px;border-radius:12px}.brand h1{font-size:22px;margin:0}.muted{color:#777;font-size:13px}.btn{border:0;border-radius:10px;padding:11px 16px;cursor:pointer;font-weight:600}.primary{background:#5a4df5;color:white}.ghost{background:white;border:1px solid #ddd}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.card{background:white;border:1px solid #e8e8ee;border-radius:18px;box-shadow:0 12px 40px #1a16320d;padding:32px}.login .card{width:min(420px,100%)}.login h1{margin:0 0 8px}.field{margin:16px 0}.field label{display:block;font-size:13px;font-weight:600;margin-bottom:7px}.field input{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;outline:none}.field input:focus{border-color:#5a4df5;box-shadow:0 0 0 3px #5a4df51a}.error{color:#c62828;font-size:13px;margin-top:12px}.dashboard{display:none}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}.toolbar input,.toolbar select{background:white;border:1px solid #ddd;border-radius:10px;padding:10px 12px}.tablewrap{background:white;border:1px solid #e5e5ea;border-radius:14px;overflow:auto}.table{border-collapse:collapse;width:100%;min-width:1350px;font-size:12px}.table th{position:sticky;top:0;background:#f8f8fb;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:#666}.table th,.table td{padding:11px 12px;border-bottom:1px solid #eee;vertical-align:top}.table tr:hover td{background:#fafaff}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#eee}.count{font-weight:600}.empty{padding:40px;text-align:center;color:#777}.small{font-size:11px;color:#777;white-space:nowrap}.email{color:#4b3fe8}.nowrap{white-space:nowrap}.actions{display:flex;gap:8px;align-items:center}.notice{margin-bottom:16px;padding:12px 14px;background:#f0efff;border:1px solid #dedbff;border-radius:10px;font-size:13px}
</style>
</head>
<body>
<div id="loginView" class="login"><div class="card"><div class="brand"><img src="/startproject-logo.png"><div><h1>StartProject Admin</h1><div class="muted">Secure lead dashboard</div></div></div><form id="loginForm"><div class="field"><label>Login ID</label><input id="loginId" type="text" autocomplete="username" required></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn primary" style="width:100%">Login →</button><div id="loginError" class="error"></div></form></div></div>
<div id="dashboard" class="dashboard"><div class="wrap"><div class="top"><div><div class="brand"><img src="/startproject-logo.png"><div><h1>StartProject Leads</h1><div class="muted" id="adminEmail"></div></div></div></div><div class="actions"><button class="btn ghost" id="refresh">Refresh</button><button class="btn ghost" id="export">Export CSV</button><button class="btn" style="background:#17171d;color:#fff" id="logout">Logout</button></div></div><div class="notice">Leads are loaded server-side from Supabase. Marketing attribution is shown where available.</div><div class="toolbar"><input id="search" placeholder="Search name, email, company, industry…" style="min-width:300px"><select id="type"><option value="">All types</option><option value="project_report">Project Report</option><option value="investor_dpr">Investor DPR</option><option value="business_plan">Business Plan</option></select><select id="source"><option value="">All sources</option><option value="meta">Meta</option><option value="google">Google</option><option value="linkedin">LinkedIn</option><option value="whatsapp">WhatsApp</option><option value="direct">Direct</option></select><span class="muted" id="count" style="align-self:center"></span></div><div class="tablewrap"><table class="table"><thead><tr><th>Date / Time</th><th>Lead</th><th>Company</th><th>Type</th><th>Project</th><th>Plan</th><th>Amount</th><th>Source</th><th>Campaign</th><th>UTM Content</th><th>GCLID / FBCLID</th><th>Status</th></tr></thead><tbody id="tbody"></tbody></table></div></div></div>
<script>
let all=[];let shown=[];
const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function money(v){if(v===null||v===undefined||v==='')return '—';return '₹'+Number(v).toLocaleString('en-IN');}
function dt(v){if(!v)return '—';const d=new Date(v);return Number.isNaN(d.getTime())?esc(v):d.toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'});}
function source(l){return esc(l.marketing_source||l.source_tag||'Direct');}
function render(){const q=$('search').value.toLowerCase().trim(),t=$('type').value,s=$('source').value;shown=all.filter(l=>{const hay=[l.name,l.email,l.company,l.industry,l.city,l.project_name,l.marketing_campaign,l.marketing_content].join(' ').toLowerCase();return(!q||hay.includes(q))&&(!t||l.type===t)&&(!s||String(l.marketing_source||l.source_tag||'direct').toLowerCase()===s)});$('count').textContent=`${shown.length} of ${all.length} leads`;$('tbody').innerHTML=shown.length?shown.map(l=>`<tr><td class="nowrap">${dt(l.submitted_at||l.created_at)}</td><td><strong>${esc(l.name||'—')}</strong><br><span class="email">${esc(l.email||'—')}</span></td><td>${esc(l.company||'—')}</td><td><span class="pill">${esc((l.type||'').replaceAll('_',' '))}</span></td><td>${esc(l.industry||'—')}<br><span class="small">${esc(l.city||'')}</span></td><td><strong>${esc(l.plan||'—')}</strong></td><td>${money(l.plan_price)}</td><td>${source(l)}</td><td>${esc(l.marketing_campaign||'—')}</td><td>${esc(l.marketing_content||'—')}</td><td class="small">${esc(l.gclid||l.fbclid||l.li_fat_id||'—')}</td><td>${esc(l.status||'new')}</td></tr>`).join(''):'<tr><td colspan="12" class="empty">No leads found.</td></tr>';}
async function load(){const r=await fetch('/api/admin-leads',{cache:'no-store'});if(r.status===401){showLogin();return}const j=await r.json();if(!r.ok)throw new Error(j.details||j.error||'Could not load leads');all=j.leads||[];$('adminEmail').textContent=j.admin||'';render();}
function showLogin(){$('loginView').style.display='grid';$('dashboard').style.display='none';}
function showDash(){$('loginView').style.display='none';$('dashboard').style.display='block';load().catch(e=>alert(e.message));}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginError').textContent='';const r=await fetch('/api/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({loginId:$('loginId').value,password:$('password').value})});const j=await r.json().catch(()=>({}));if(!r.ok){$('loginError').textContent=j.error||'Login failed';return}showDash();});
$('logout').onclick=async()=>{await fetch('/api/admin-logout',{method:'POST'});showLogin();};$('refresh').onclick=()=>load().catch(e=>alert(e.message));$('search').oninput=render;$('type').onchange=render;$('source').onchange=render;
$('export').onclick=()=>{if(!shown.length)return;const cols=['submitted_at','name','email','company','type','business_type','industry','city','project_value','business_model','education','work_experience','purposes','amount_needed','requirements','plan','plan_price','status','source_tag','marketing_source','marketing_medium','marketing_campaign','marketing_content','marketing_term','gclid','fbclid','li_fat_id','landing_page','referrer'];const csv=[cols.join(','),...shown.map(l=>cols.map(c=>`"${String(l[c]??'').replaceAll('"','""')}"`).join(','))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='startproject-leads.csv';a.click();URL.revokeObjectURL(a.href);};
fetch('/api/admin-me',{cache:'no-store'}).then(r=>r.ok?showDash():showLogin()).catch(showLogin);
</script>
</body></html>
